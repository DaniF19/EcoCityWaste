  namespace: EcoCityWaste.Services
  summary: >-
    Grava de forma assíncrona os detalhes de uma exceção na tabela de FailureLogs.

    Captura a mensagem de erro, o stack trace, o local exato da falha e o utilizador afetado.
  example: []
  syntax:
    content: public Task LogAsync(Exception ex, string controller, string action, string? user)
    parameters:
    - id: ex
      type: System.Exception
      description: A exceção capturada pelo bloco try-catch.
    - id: controller
      type: System.String
      description: O nome do controlador onde o erro ocorreu.
    - id: action
      type: System.String
      description: O nome da ação/método que despoletou a falha.
    - id: user
      type: System.String
      description: O nome do utilizador que estava autenticado no momento (opcional).
    return:
      type: System.Threading.Tasks.Task
      description: Uma Task que representa a operação de escrita do log.
