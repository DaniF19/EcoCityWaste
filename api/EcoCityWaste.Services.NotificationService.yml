  summary: >-
    Método genérico e versátil para enviar notificações personalizadas a qualquer utilizador do sistema.

    Pode ser usado para informar cidadãos sobre o estado de ocorrências ou funcionários sobre novas rotas.
  example: []
  syntax:
    content: public Task CreateNotificationAsync(string message, int userId, string? linkUrl = null, string? notificationType = null)
    parameters:
    - id: message
      type: System.String
      description: O texto informativo da notificação.
    - id: userId
      type: System.Int32
      description: O identificador do utilizador destinatário.
    - id: linkUrl
      type: System.String
      description: URL opcional para onde o utilizador será redirecionado ao clicar na notificação.
    - id: notificationType
      type: System.String
      description: Categoria da notificação para fins de estilização.
    return:
      type: System.Threading.Tasks.Task
      description: Uma Task assíncrona.
