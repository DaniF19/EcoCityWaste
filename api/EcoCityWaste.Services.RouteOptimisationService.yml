  assemblies:
  - EcoCityWaste
  namespace: EcoCityWaste.Services
  summary: >-
    Executa o algoritmo de otimização sobre uma lista de contentores.

    1. Identifica o contentor mais cheio como ponto de partida.

    2. Procura sucessivamente o contentor mais próximo do anterior.

    3. Relega contentores sem coordenadas GPS para o final da lista para não quebrar o cálculo.
  example: []
  syntax:
    content: public OptimisedRouteDto Optimise(IEnumerable<Container> containers)
    parameters:
    - id: containers
      type: System.Collections.Generic.IEnumerable{EcoCityWaste.Models.Container}
      description: A coleção de contentores associados a uma rota.
    return:
      type: EcoCityWaste.ViewModels.OptimisedRouteDto
      description: Um DTO contendo a sequência otimizada de paragens e a distância total estimada.
    content.vb: Public Function Optimise(containers As IEnumerable(Of Container)) As OptimisedRouteDto
