  assemblies:
  - EcoCityWaste
  namespace: EcoCityWaste.Services
  summary: >-
    Cria e guarda um novo registo na tabela de histórico sempre que um contentor é alterado.

    Captura uma "fotografia" do estado, nível de enchimento e atividade no momento exato da modificação.
  example: []
  syntax:
    content: public Task AddHistory(Container container, string? changedBy)
    parameters:
    - id: container
      type: EcoCityWaste.Models.Container
      description: O objeto do contentor que sofreu a alteração.
    - id: changedBy
      type: System.String
      description: O nome do utilizador que efetuou a alteração (ou nulo, se for uma atualização automática do sistema).
    return:
      type: System.Threading.Tasks.Task
      description: Uma Task assíncrona que representa a operação de salvaguarda na base de dados.
    content.vb: Public Function AddHistory(container As Container, changedBy As String) As Task
